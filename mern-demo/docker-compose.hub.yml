services:
  backend:
    image: huyhuynh0712/mern-backend:1.0
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb+srv://huyhuynh0712:huy123@huyhuynh0712.puaczlq.mongodb.net/cloud_lab?retryWrites=true&w=majority
    networks:
      - mern-network

  frontend:
    image: huyhuynh0712/mern-frontend:2.0
    ports:
      - "5173:5173"
